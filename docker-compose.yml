services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fitness:${POSTGRES_PASSWORD:-fitness}@db:5432/fitness
    ports:
      # Host port 80 (override with HTTP_PORT in .env) -> gunicorn on 8000 inside the container
      - "${HTTP_PORT:-80}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness}
      POSTGRES_DB: fitness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
