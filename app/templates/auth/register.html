{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="login">
  <h1 class="login-brand">Repsy</h1>
  <p class="muted">Create your account.</p>

  <form method="post" class="card form auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" value="{{ form.email }}" autocomplete="email" required autofocus>
    </label>
    <label>Name <span class="muted small">(optional)</span>
      <input type="text" name="name" value="{{ form.name }}" autocomplete="name">
    </label>
    <label>Password <span class="muted small">(at least 8 characters)</span>
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="small">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>

  {% include "auth/_sso.html" %}
</section>
{% endblock %}
