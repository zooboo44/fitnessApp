{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="login">
  <h1 class="login-brand">Repsy</h1>
  <p class="muted">Track your lifts, reps and rest.</p>

  <form method="post" class="card form auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <p class="small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>

  {% include "auth/_sso.html" %}
</section>
{% endblock %}
